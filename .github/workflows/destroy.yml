name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to tear down all server infrastructure
        required: true
      skip_backup:
        description: Skip the final backup (the current world will be lost)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: minecraft-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_backup_bucket: ${{ vars.BACKUP_BUCKET }}

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=minecraft/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Find server
        id: server
        run: echo "instance_id=$(terraform output -raw instance_id 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      # If this fails, the destroy is aborted so the world isn't lost.
      - name: Final backup
        if: ${{ !inputs.skip_backup && steps.server.outputs.instance_id != '' }}
        run: scripts/run-backup.sh "${{ steps.server.outputs.instance_id }}"

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
