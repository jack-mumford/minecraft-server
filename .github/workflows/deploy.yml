name: Deploy

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: Minecraft version to run (blank = value in minecraft.auto.tfvars)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: minecraft-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_backup_bucket: ${{ vars.BACKUP_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=minecraft/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}
        run: |
          args=()
          if [ -n "$MC_VERSION" ]; then args+=(-var "minecraft_version=$MC_VERSION"); fi
          terraform apply -input=false -auto-approve "${args[@]}"

      - name: Summary
        run: |
          {
            echo "### Minecraft server deployed"
            echo "Address: \`$(terraform output -raw server_address)\`"
            echo
            echo "The server needs a few minutes after first boot to install and start."
          } >> "$GITHUB_STEP_SUMMARY"
