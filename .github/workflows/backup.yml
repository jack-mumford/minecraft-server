name: Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC

permissions:
  id-token: write
  contents: read

concurrency:
  group: minecraft-terraform
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=minecraft/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Find server
        id: server
        run: echo "instance_id=$(terraform output -raw instance_id 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Back up world to S3
        if: steps.server.outputs.instance_id != ''
        run: scripts/run-backup.sh "${{ steps.server.outputs.instance_id }}"

      - name: No server deployed
        if: steps.server.outputs.instance_id == ''
        run: echo "No server is deployed; nothing to back up."
